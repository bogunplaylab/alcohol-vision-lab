<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>현관 비밀번호 체험</title><style>
*{box-sizing:border-box}body{margin:0;background:#222638;color:white;font-family:system-ui,'Apple SD Gothic Neo',sans-serif}main{height:100dvh;display:flex;align-items:center;justify-content:center}.scene{position:relative;width:min(100vw,133.33dvh);aspect-ratio:1448/1086;background:url('door.png') center/100% 100% no-repeat;overflow:hidden}.password{position:absolute;left:9.6%;top:27.4%;width:40.3%;height:9.4%;border:2px solid #e7e7f0;border-radius:18px;background:linear-gradient(110deg,#303347,#35374b);display:flex;align-items:center;justify-content:center;gap:3%;font-size:clamp(12px,2.4vw,31px);white-space:nowrap}.password strong{font-size:1.55em;font-weight:400;letter-spacing:.07em;text-shadow:0 0 8px #dbe6ff}.key{position:absolute;transform:translate(-50%,-50%);width:9%;height:10%;border:0;background:transparent;border-radius:25%;touch-action:manipulation;cursor:pointer}.key:active,.key.pressed{background:#a6cfff35;box-shadow:0 0 18px #b5e5ff77}.dots{position:absolute;inset:0;pointer-events:none}.dots span{position:absolute;top:23.94%;width:1.65%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:transparent}.dots span:nth-child(1){left:61.88%}.dots span:nth-child(2){left:65.54%}.dots span:nth-child(3){left:69.13%}.dots span:nth-child(4){left:72.79%}.dots span:nth-child(5){left:76.38%}.dots span:nth-child(6){left:80.04%}.dots span.filled{background:#d7f7ff;box-shadow:0 0 9px #fff,0 0 4px #c9efff}.start,.result,.peek{position:absolute;inset:0;background:#181c2ae8;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;text-align:center;padding:25px;z-index:10}.start h1,.result h1{font-size:clamp(22px,3vw,38px);margin:0}.start p,.result p{line-height:1.7;font-size:clamp(15px,1.7vw,23px);margin:0}.action{border:0;background:#e9f0ff;color:#161c30;padding:14px 30px;border-radius:14px;font-size:clamp(17px,2vw,25px);font-weight:700;cursor:pointer}.peek{background:#181c2af4}.peek strong{font-size:clamp(32px,5vw,70px);letter-spacing:.13em}.small{font-size:clamp(24px,3.1vw,43px);font-weight:850;color:#fff;opacity:1;text-shadow:0 2px 8px #000}.countdown{font-size:clamp(48px,7vw,96px);font-weight:900;color:#ffe477;text-shadow:0 3px 12px #000;line-height:1.1}.again{position:absolute;left:10%;top:40%;width:40%;min-height:10%;border:3px solid #e7f1ff;background:#182b4b;color:#fff;padding:12px 8px;border-radius:14px;font-size:clamp(20px,2.65vw,38px);font-weight:900;line-height:1.25;text-shadow:0 2px 5px #000;box-shadow:0 0 0 2px #263e60,0 5px 18px #0008;cursor:pointer;z-index:3}.feedback{position:absolute;left:10%;top:51%;width:39%;text-align:center;font-size:clamp(13px,1.8vw,23px);color:#f7d8d8}.hidden{display:none!important}
</style></head><body><main><div class="scene" id="scene"><div class="password"><span>비밀번호</span><strong id="password">------</strong></div><div class="dots" id="dots"></div><button class="again hidden" id="again">비밀번호 다시 보기</button><div class="feedback" id="feedback"></div><div class="start" id="start"><h1>현관 비밀번호 체험</h1><button class="action" id="startBtn">체험 시작</button></div><div class="peek hidden" id="peek"><div class="small">비밀번호를 기억하세요</div><strong id="peekCode"></strong><div class="countdown" id="countdown" aria-live="polite">5초</div></div><div class="result hidden" id="result"><h1 id="resultTitle">체험 결과</h1><p id="resultText"></p><button class="action" id="restart">다시 체험하기</button></div></div></main><script>
const scene=document.getElementById('scene'),dots=document.getElementById('dots'),password=document.getElementById('password'),feedback=document.getElementById('feedback'),again=document.getElementById('again');let code='',input='',mistakes=0,views=0,startTime=0,active=false,peeking=false,peekTimer=null,peekInterval=null,codeVisible=false;const positions={1:[60.1,33.4],2:[69.3,33.4],3:[78.4,33.4],4:[60.1,42.8],5:[69.3,42.8],6:[78.4,42.8],7:[60.1,52.1],8:[69.3,52.1],9:[78.4,52.1],0:[69.3,61.4],X:[60.1,61.4],OK:[78.4,61.4]};for(const [num,[x,y]] of Object.entries(positions)){const b=document.createElement('button');b.className='key';b.style.left=x+'%';b.style.top=y+'%';b.setAttribute('aria-label',num==='X'?'취소':num==='OK'?'확인':num);b.onclick=()=>press(num,b);scene.appendChild(b)}function render(){dots.innerHTML=Array.from({length:6},(_,i)=>`<span class="${i<input.length?'filled':''}"></span>`).join('');password.textContent=codeVisible?code:'••••••';}function showCode(){if(!active||codeVisible)return;codeVisible=true;views=1;again.classList.add('hidden');feedback.textContent='비밀번호를 확인하며 입력할 수 있습니다';render()}
function begin(){code=Array.from({length:6},()=>Math.floor(Math.random()*10)).join('');input='';mistakes=0;views=0;startTime=0;active=false;peeking=true;codeVisible=false;feedback.textContent='';clearTimeout(peekTimer);clearInterval(peekInterval);document.getElementById('start').classList.add('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('peek').classList.remove('hidden');again.classList.add('hidden');document.getElementById('peekCode').textContent=code;render();let t=5;document.getElementById('countdown').textContent=`${t}초`;peekInterval=setInterval(()=>{t--;document.getElementById('countdown').textContent=`${Math.max(1,t)}초`},1000);peekTimer=setTimeout(()=>{clearInterval(peekInterval);document.getElementById('peek').classList.add('hidden');peeking=false;active=true;startTime=performance.now();again.classList.remove('hidden');render()},5000)}
function press(n,b){if(!active)return;b.classList.add('pressed');setTimeout(()=>b.classList.remove('pressed'),180);if(n==='X'){input='';feedback.textContent='입력을 지웠습니다';render();return}if(n==='OK'){if(input.length!==6){feedback.textContent='숫자 6자리를 입력하세요';return}if(input===code){finish(true)}else{mistakes++;feedback.textContent='비밀번호가 틀렸습니다. 다시 입력하세요';input='';render()}return}if(input.length<6){input+=n;feedback.textContent='';render()}}function finish(ok){active=false;again.classList.add('hidden');const seconds=((performance.now()-startTime)/1000).toFixed(1);document.getElementById('resultTitle').textContent=ok?'현관문 열기 성공!':'체험 결과';document.getElementById('resultText').innerHTML=`입력 성공: ${ok?'성공':'실패'}<br>걸린 시간: ${seconds}초<br>틀린 입력: ${mistakes}회<br>비밀번호 다시 보기: ${views?'사용':'미사용'}<br><br><small>시간은 참고 기록이며 점수에 반영하지 않습니다.</small>`;parent.postMessage({type:'missionDone',mission:4,value:mistakes+'회',detail:{success:ok,seconds:Number(seconds),views}},'*');document.getElementById('result').classList.remove('hidden')}document.getElementById('startBtn').onclick=begin;document.getElementById('restart').onclick=begin;again.onclick=showCode;
</script></body></html>
