*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,'Malgun Gothic',sans-serif;background:#14243b;color:#fff}button{font:inherit;cursor:pointer;border:0;font-weight:900}.page{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2vh 3vw;gap:2.3vh;text-align:center}.eyebrow{color:#bed2ed;font-size:clamp(14px,2vw,22px);font-weight:700}.heading{font-size:clamp(30px,4.4vw,58px);margin:0}.sub{font-size:clamp(16px,2vw,25px);color:#d5e1f0;margin:0}.choices{display:flex;gap:2vw;width:min(1050px,100%);justify-content:center}.choice{flex:1;min-height:17vh;background:#304a68;border:2px solid #708ba9;color:white;border-radius:20px;padding:20px;font-size:clamp(21px,3vw,34px)}.choice small{display:block;font-size:clamp(14px,1.5vw,19px);font-weight:500;margin-top:9px}.choice:focus-visible,.primary:focus-visible{outline:5px solid #f4cb4c}.primary{background:#f4c94c;color:#17283f;border-radius:18px;padding:2.5vh 5vw;font-size:clamp(23px,3vw,38px);min-width:min(480px,90%)}.secondary{background:#314b68;color:white;border:2px solid #8ca6c4;border-radius:15px;padding:12px 22px;font-size:clamp(16px,2vw,23px)}.back{position:absolute;top:14px;left:16px;z-index:4;background:#243a55;color:white;padding:10px 18px;border-radius:12px;font-size:17px}.hidden{display:none!important}#game{width:100%;height:100dvh;border:0;display:block;background:#101b2d}.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2vw;width:min(1000px,100%)}.result{background:#30465f;border-radius:18px;padding:2.8vh 2vw}.result .name{font-size:clamp(20px,2.4vw,29px);font-weight:800}.result .value{font-size:clamp(32px,5vw,64px);font-weight:900;margin:1vh 0}.result .label{font-size:clamp(14px,1.8vw,22px);color:#d1dfef}.actions{display:flex;gap:15px;justify-content:center;flex-wrap:wrap}.note{font-size:clamp(13px,1.5vw,18px);color:#c3d2e5}#resultPage .heading{font-size:clamp(28px,3.5vw,48px)}@media(max-height:550px){.page{gap:1.2vh}.choice{min-height:15vh}.result{padding:1.5vh 2vw}.result .value{margin:.5vh 0}.heading{font-size:32px}}
</style><link rel="stylesheet" href="jh-brand.css"><style>

.guide-top,.guide-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-shrink:0}.guide-top h2{margin:0;font-size:clamp(20px,2.6vw,33px)}.guide-close{background:#374775;color:white;border:2px solid #8996c8;border-radius:12px;padding:7px 16px;font-size:20px}.guide-progress{color:#d2c9ff;font-size:clamp(15px,1.7vw,22px);font-weight:900}.guide-body{min-height:0;flex:1;display:flex;gap:clamp(12px,2vw,25px);align-items:stretch}.guide-visual{flex:1.15;min-width:0;position:relative;border:2px solid #6775b7;border-radius:16px;overflow:hidden;background:#111d37;display:flex;align-items:center;justify-content:center}.guide-visual img{width:100%;height:100%;object-fit:contain}.guide-demo-button{position:absolute;bottom:8%;left:50%;transform:translateX(-50%);min-width:45%;padding:clamp(9px,1.7vh,18px) 18px;border-radius:16px;color:#fff;font-size:clamp(20px,3vw,38px);border:3px solid #fff9;box-shadow:0 5px 0 #0007}.guide-demo-button.walk{background:#15984c}.guide-demo-button.stop{background:#e53d43}.guide-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(9px,1.5vh,17px)}.guide-kicker{color:#d0bbff;font-weight:900;font-size:clamp(15px,1.7vw,21px)}.guide-info h3{margin:0;font-size:clamp(23px,3vw,38px);line-height:1.18}.guide-tagline{font-size:clamp(16px,1.8vw,24px);color:#ffdf7b;font-weight:800}.guide-steps{margin:0;padding-left:1.4em;font-size:clamp(15px,1.65vw,22px);line-height:1.55}.guide-steps li{margin-bottom:.35em}.guide-goal{border-radius:12px;background:#354471;padding:clamp(9px,1.5vh,16px);font-size:clamp(14px,1.55vw,20px);line-height:1.4}.guide-foot button{background:#7566db;color:white;border-radius:13px;padding:10px 24px;font-size:clamp(17px,1.8vw,23px)}.guide-foot button:disabled{opacity:.3;cursor:default}.guide-hint{color:#cad4ef;font-size:clamp(12px,1.3vw,16px);text-align:center}.guide-demo-visual{position:relative;width:100%;height:100%;background-position:center;background-size:contain;background-repeat:no-repeat}.guide-demo-visual.m2{background-image:url('m2/assets/background_green.png')}.guide-demo-visual.m1{background-image:url('m1/assets/parking_alley.png')}.guide-demo-visual.m3{background-image:url('m3/scene1.png')}.guide-demo-visual.m4{background-image:none;background-color:#17243e}.guide-sample{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);background:#e53d43;border:3px solid white;border-radius:14px;padding:10px 28px;font-size:clamp(19px,2.5vw,32px);font-weight:900;white-space:nowrap}.guide-sample.caption{background:#202f65;bottom:5%;font-size:clamp(13px,1.5vw,19px)}

</style></head><body>
<section id="splash" class="page"><button class="splash-start" onclick="show('home')">게임 시작하기</button><button class="guide-open" onclick="openGuide()">ⓘ 체험 방법 안내</button></section>
<section id="home" class="page"><div class="eyebrow">음주 위험 실험실</div><h1 class="heading">음주고글을 쓰고 네 가지 미션에 도전하세요!</h1><p class="sub">체험 방식을 선택하세요</p><div class="choices"><button class="choice" onclick="choose('split')">디벗 2대 분리 체험<small>두 구역으로 나누어 진행</small></button><button class="choice" onclick="choose('all')">디벗 1대 통합 체험<small>네 가지 미션을 연속 체험</small></button></div></section>
<section id="zone" class="page hidden"><div class="eyebrow">2대 분리 체험</div><h1 class="heading">체험 구역 선택</h1><div class="choices"><button class="choice" onclick="setMode('a')">디벗 1 · A구역<small>골목길 → 횡단보도</small></button><button class="choice" onclick="setMode('b')">디벗 2 · B구역<small>엘리베이터 → 도어락</small></button></div><button class="secondary" onclick="show('home')">뒤로</button></section>
<section id="ready" class="page hidden"><div class="eyebrow" id="modeName"></div><h1 class="heading">체험 준비</h1><p class="sub" id="missionNames"></p><button class="primary" onclick="startPerson()">체험 시작</button><button class="secondary" onclick="changeMode()">체험 방식 변경</button></section>
<section id="playing" class="hidden"><iframe id="game" title="체험 미션"></iframe></section>
<section id="transition" class="page hidden"><div class="eyebrow" id="progressLabel"></div><h1 class="heading" id="nextTitle">다음 미션</h1><button class="primary" onclick="nextMission()">다음 미션 시작</button></section>
<section id="resultPage" class="page hidden"><div class="eyebrow" id="resultMode"></div><h1 class="heading">체험 결과</h1><div id="results" class="results"></div><div class="actions"><button class="primary" onclick="nextPerson()">다음 체험자 시작</button></div><div class="note">도우미가 활동지에 기록한 뒤 다음 체험자를 시작하세요.</div></section>

<div id="guideOverlay" class="hidden" role="dialog" aria-modal="true" aria-label="체험 방법 안내">
  <div class="guide-panel">
    <div class="guide-top"><h2>🥽 체험 방법 안내</h2><div style="display:flex;align-items:center;gap:14px"><span id="guideCount" class="guide-progress">1 / 4</span><button class="guide-close" onclick="closeGuide()" aria-label="닫기">✕</button></div></div>
    <div class="guide-body"><div class="guide-visual"><div id="guideScene" class="guide-demo-visual m1"></div></div><div class="guide-info"><div id="guideKicker" class="guide-kicker">MISSION 01</div><h3 id="guideTitle"></h3><div id="guideTagline" class="guide-tagline"></div><ol id="guideSteps" class="guide-steps"></ol><div id="guideGoal" class="guide-goal"></div></div></div>
    <div class="guide-foot"><button id="guidePrev" onclick="changeGuide(-1)">◀ 이전</button><span class="guide-hint">게임 방법만 미리 연습해요 · 실제 미션 기록과 무관</span><button id="guideNext" onclick="changeGuide(1)">다음 ▶</button></div>
  </div>
</div>
<script>

// Guide is a standalone preview; never loads or modifies the real mission iframe.
const guideSlides=[
 {title:'골목길',tag:'위험을 발견하면 빠르게 멈춰라!',steps:['‘체험 시작’ 버튼을 누르면 골목길 장면이 시작됩니다.','화면을 잘 살펴보며 위험한 변화가 나타나는지 관찰하세요.','위험이 나타나는 순간 빨간색 ‘멈춤’ 버튼을 누르세요.'],goal:'🎯 실험 목표: 위험이 나타난 후 멈춤 버튼을 누르기까지 걸린 반응 시간이 몇 초인지 확인해 보세요!'},
 {title:'횡단보도',tag:'신호를 확인하고 위험에 빠르게 대처하라!',steps:['초록불이 켜지면 ‘걸어가기’ 버튼을 누르세요.','횡단보도를 건너는 동안 주변을 살펴보세요.','위험이 나타나면 ‘멈춤’ 버튼을 빠르게 누르세요.'],goal:'🎯 실험 목표: 신호 확인과 위험 대처를 포함한 총 3가지 상황의 성공 횟수를 확인해 보세요!'},
 {title:'엘리베이터',tag:'안내된 층을 정확하게 눌러라!',steps:['화면 위쪽에 표시되는 목표 층을 확인하세요.','엘리베이터에서 해당 층의 버튼을 찾아 직접 누르세요.','총 3번 도전합니다.'],goal:'🎯 실험 목표: 목표 층의 버튼을 3번 중 몇 번 정확하게 눌렀는지 확인해 보세요!'},
 {title:'도어락',tag:'6자리 비밀번호를 기억하라!',steps:['화면에 나타나는 6자리 비밀번호를 5초 동안 기억하세요.','비밀번호가 사라지면 숫자 버튼을 눌러 입력하고 OK 버튼을 누르세요.','기억나지 않으면 ‘비밀번호 다시 보기’ 버튼을 누를 수 있어요.'],goal:'🎯 실험 목표: 비밀번호를 입력하면서 몇 번 틀렸는지 확인해 보세요!'}
];
let guidePage=0,guideWalking=false;
function openGuide(){guidePage=0;guideWalking=false;renderGuide();document.getElementById('guideOverlay').classList.remove('hidden')}
function closeGuide(){document.getElementById('guideOverlay').classList.add('hidden')}
function changeGuide(delta){guidePage=Math.max(0,Math.min(3,guidePage+delta));guideWalking=false;renderGuide()}
function toggleGuideWalk(){guideWalking=!guideWalking;renderGuideButton()}
function renderGuideButton(){const b=document.getElementById('guideWalkButton');if(!b)return;b.textContent=guideWalking?'멈춤':'🚶 걸어가기';b.className='guide-demo-button '+(guideWalking?'stop':'walk')}
function renderGuide(){const d=guideSlides[guidePage],scene=document.getElementById('guideScene');document.getElementById('guideCount').textContent=(guidePage+1)+' / 4';document.getElementById('guideKicker').textContent='MISSION 0'+(guidePage+1);document.getElementById('guideTitle').textContent=d.title;document.getElementById('guideTagline').textContent=d.tag;document.getElementById('guideSteps').replaceChildren(...d.steps.map(t=>{const li=document.createElement('li');li.textContent=t;return li}));document.getElementById('guideGoal').textContent=d.goal;scene.className='guide-demo-visual m'+(guidePage+1);scene.replaceChildren();if(guidePage===0){const b=document.createElement('div');b.className='guide-sample';b.textContent='멈춤';scene.append(b)}if(guidePage===1){const b=document.createElement('button');b.id='guideWalkButton';b.type='button';b.onclick=toggleGuideWalk;scene.append(b);renderGuideButton()}if(guidePage===2){const img=document.createElement('div');img.className='guide-m3-image';scene.append(img);const target=document.createElement('div');target.className='guide-m3-target';target.textContent='목표: ○층 버튼을 누르세요';scene.append(target)}if(guidePage===3){const frame=document.createElement('div');frame.className='guide-m4-frame';const hidden=document.createElement('div');hidden.className='guide-m4-hidden-code';hidden.textContent='비밀번호  ••••••';frame.append(hidden);const again=document.createElement('div');again.className='guide-m4-again';again.textContent='비밀번호 다시 보기';frame.append(again);scene.append(frame)}document.getElementById('guidePrev').disabled=guidePage===0;const next=document.getElementById('guideNext');next.textContent=guidePage===3?'안내 닫기 ✕':'다음 ▶';next.onclick=guidePage===3?closeGuide:()=>changeGuide(1)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('guideOverlay').classList.contains('hidden'))closeGuide()});

const labels={1:['골목길','평균 멈춤 반응 시간'],2:['횡단보도','안전 대처'],3:['엘리베이터','정답'],4:['도어락','비밀번호 오입력']};const paths={1:'m1/index.html',2:'m2/index.html',3:'m3/index.html',4:'m4/index.html'};const sequences={a:[1,2],b:[3,4],all:[1,2,3,4]};const names={a:'디벗 1 · A구역',b:'디벗 2 · B구역',all:'1대 통합 체험'};let mode=null,position=0,records={},done=false;
function show(id){for(const s of document.querySelectorAll('body>section'))s.classList.toggle('hidden',s.id!==id)}
function choose(v){if(v==='split')show('zone');else setMode('all')}
function setMode(v){mode=v;document.getElementById('modeName').textContent=names[v];document.getElementById('missionNames').textContent=sequences[v].map(i=>labels[i][0]).join(' → ');show('ready')}
function changeMode(){mode=null;show('home')}
function startPerson(){records={};position=0;loadMission()}
function loadMission(){done=false;const id=sequences[mode][position];const f=document.getElementById('game');f.src=paths[id]+'?run='+Date.now();show('playing')}
window.addEventListener('message',e=>{if(e.source!==document.getElementById('game').contentWindow||!mode||e.data?.type!=='missionDone')return;const id=sequences[mode][position];if(e.data.mission!==id||done)return;done=true;records[id]={value:e.data.value,detail:e.data.detail};document.getElementById('game').src='about:blank';if(position+1<sequences[mode].length){document.getElementById('progressLabel').textContent=labels[id][0]+' 완료';document.getElementById('nextTitle').textContent='다음: '+labels[sequences[mode][position+1]][0];show('transition')}else renderResults()});
function nextMission(){position++;loadMission()}
function conciseResult(id,record){if(!record)return '—';if(id===2){const d=record.detail||{};return '성공 '+[d.signal,d.car,d.motor].filter(Boolean).length+'회'}if(id===3){const d=record.detail||{};if(Array.isArray(d.answers))return '정답 '+d.answers.filter(a=>a.correct).length+'회';const n=parseInt(record.value,10);return Number.isFinite(n)?'정답 '+n+'회':record.value}if(id===4)return '오입력 '+record.value;return record.value}
function renderResults(){document.getElementById('resultMode').textContent=names[mode];document.getElementById('results').innerHTML=sequences[mode].map(id=>'<div class="result"><div class="name">'+labels[id][0]+'</div><div class="value">'+conciseResult(id,records[id])+'</div><div class="label">'+(id===2?'안전하게 대처한 횟수':id===3?'올바른 층 선택 횟수':labels[id][1])+'</div></div>').join('');show('resultPage')}
function nextPerson(){records={};position=0;loadMission()}
</script><script src="jh-brand.js"></script><script>
/* Only brand elements are switched; the game's original navigation is untouched. */
(function(){
 const originalShow=window.show;
 window.show=function(id){originalShow(id);if(window.JHBrand){
   if(id==='splash') JHBrand.mount({mode:'home',logo:'small',assetBase:'assets/'});
   else if(id==='playing') JHBrand.mount({mode:'game'});
   else {const host=document.getElementById('jh-brand-root');if(host)host.remove();}
 }};
 window.show('splash');
})();
</script></body></html>
